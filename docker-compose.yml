services:
  # Agent UI - Next.js Frontend
  agent-ui:
    build:
      context: ./Agent_UI
      dockerfile: Dockerfile
    container_name: agent-ui
    ports:
      - "3000:3000"
    environment:
      # API endpoint for the backend
      NEXT_PUBLIC_API_URL: http://supervisor-api:8000
      NODE_ENV: production
    depends_on:
      - supervisor-api
    networks:
      - supervisor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Supervisor Agent API Service (Backend)
  supervisor-api:
    build:
      context: .
      dockerfile: dockerfile.api
    container_name: supervisor-api
    ports:
      - "8000:8000"
    environment:
      # LLM Configuration - Point to LiteLLM proxy
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      LLM_PROVIDER: ${LLM_PROVIDER:-litellm}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-4o-mini}
      LLM_MODEL_TYPE: ${LLM_MODEL_TYPE:-chat}

      # LiteLLM Proxy URL (if using local LiteLLM service)
      LITELLM_PROXY_URL: ${LITELLM_PROXY_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234}

      # LangSmith Tracing
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}

      # AWS Bedrock Configuration (if using Bedrock)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}

      # Enterprise Integrations
      CONFLUENCE_URL: ${CONFLUENCE_URL}
      CONFLUENCE_USERNAME: ${CONFLUENCE_USERNAME}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN}
      CONFLUENCE_SSL_VERIFY: ${CONFLUENCE_SSL_VERIFY:-false}

      JIRA_URL: ${JIRA_URL}
      JIRA_PERSONAL_TOKEN: ${JIRA_PERSONAL_TOKEN}
      JIRA_SSL_VERIFY: ${JIRA_SSL_VERIFY:-false}

      GITLAB_PERSONAL_ACCESS_TOKEN: ${GITLAB_PERSONAL_ACCESS_TOKEN}
      GITLAB_API_URL: ${GITLAB_API_URL}
      GITLAB_PROJECT_ID: ${GITLAB_PROJECT_ID}

      # MCP Configuration
      MCP_VERY_VERBOSE: ${MCP_VERY_VERBOSE:-true}

      # MCP Server URLs (for SSE transport)
      MCP_ATLASSIAN_URL: ${MCP_ATLASSIAN_URL:-http://mcp-atlassian:3000}
      MCP_GITLAB_URL: ${MCP_GITLAB_URL:-http://mcp-gitlab:3002}
      MCP_CONTEXT7_URL: ${MCP_CONTEXT7_URL:-http://mcp-context7:3003}
      MCP_CONTEXT7_ENABLED: ${MCP_CONTEXT7_ENABLED:-true}
      MCP_ATLASSIAN_ENABLED: ${MCP_ATLASSIAN_ENABLED:-true}
      MCP_GITLAB_ENABLED: ${MCP_GITLAB_ENABLED:-true}
      MCP_GITHUB_ENABLED: ${MCP_GITHUB_ENABLED:-true}
    volumes:
      - .:/app
      - chroma_db:/app/chroma_db
    depends_on:
      - mcp-atlassian
      - mcp-gitlab
      - mcp-context7
      - litellm
    networks:
      - supervisor-network
    restart: unless-stopped

  # LiteLLM Proxy Server
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    environment:
      # LiteLLM Configuration
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234}
      # Provider API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_LITE_LLM_PAT: ${GITHUB_LITE_LLM_PAT}

      # AWS Credentials for Bedrock
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION_NAME: ${AWS_REGION:-us-east-1}

      # LiteLLM Settings
      LITELLM_LOG: "INFO"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: --config /app/config.yaml --port 4000 --num_workers 4
    networks:
      - supervisor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # # MongoDB for Document Storage
  # mongodb:
  #   image: mongo:7.0
  #   container_name: supervisor-mongodb
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
  #     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
  #   volumes:
  #     - mongodb_data:/data/db
  #     - mongodb_config:/data/configdb
  #   networks:
  #     - supervisor-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # MCP Atlassian Server (Confluence & Jira)
  mcp-atlassian:
    image: ghcr.io/sooperset/mcp-atlassian:latest
    container_name: mcp-atlassian-server
    ports:
      - "3001:3000"
    environment:
      CONFLUENCE_URL: ${CONFLUENCE_URL}
      CONFLUENCE_USERNAME: ${CONFLUENCE_USERNAME}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN}
      CONFLUENCE_SSL_VERIFY: ${CONFLUENCE_SSL_VERIFY:-false}
      JIRA_URL: ${JIRA_URL}
      JIRA_USERNAME: ${JIRA_USERNAME:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PERSONAL_TOKEN: ${JIRA_PERSONAL_TOKEN}
      JIRA_SSL_VERIFY: ${JIRA_SSL_VERIFY:-false}
    command: --transport streamable-http --port 3000 -vv
    networks:
      - supervisor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MCP GitLab Server
  mcp-gitlab:
    image: zereight050/gitlab-mcp:latest
    container_name: mcp-gitlab-server
    ports:
      - "3333:3002"
    environment:
      HOST: 0.0.0.0
      GITLAB_PERSONAL_ACCESS_TOKEN: ${GITLAB_PERSONAL_ACCESS_TOKEN}
      GITLAB_API_URL: ${GITLAB_API_URL}
      GITLAB_READ_ONLY_MODE: "false"
      USE_GITLAB_WIKI: "true"
      USE_MILESTONE: "true"
      USE_PIPELINE: "true"
    networks:
      - supervisor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MCP Context7 Server (Library Documentation)
  mcp-context7:
    image: node:20-alpine
    container_name: mcp-context7-server
    ports:
      - "3003:3003"
    command: npx -y supergateway --stdio "npx -y @upstash/context7-mcp" --outputTransport streamableHttp --port 3003 --host 0.0.0.0
    networks:
      - supervisor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # # Optional: MongoDB Express for GUI management
  # mongo-express:
  #   image: mongo-express:latest
  #   container_name: supervisor-mongo-express
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME:-admin}
  #     ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-password}
  #     ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/
  #   depends_on:
  #     - mongodb
  #   networks:
  #     - supervisor-network
  #   restart: unless-stopped
  #   profiles:
  #     - debug

volumes:
  # mongodb_data:
  #   driver: local
  # mongodb_config:
  #   driver: local
  chroma_db:
    driver: local

networks:
  supervisor-network:
    driver: bridge

# Usage Instructions:
# ==================
# 1. Create .env file with necessary environment variables (see .env.example)
# 2. Create litellm_config.yaml for LiteLLM configuration
# 3. Run: docker-compose up -d
#
# Services Available:
# - Agent UI (Next.js):          http://localhost:3000
# - Supervisor API (Backend):    http://localhost:8000
# - LiteLLM Proxy:               http://localhost:4000
# - MongoDB Express (optional):  http://localhost:8081
# - MCP Atlassian:               http://localhost:3001
# - MCP GitLab:                  http://localhost:3333
# - MCP Context7:                http://localhost:3003
#
# Commands:
# - Start all services:          docker-compose up -d
# - View logs:                   docker-compose logs -f [service-name]
# - Stop all services:           docker-compose down
# - Stop and remove volumes:     docker-compose down -v
# - Rebuild services:            docker-compose up -d --build
# - Start with debug profile:    docker-compose --profile debug up -d
